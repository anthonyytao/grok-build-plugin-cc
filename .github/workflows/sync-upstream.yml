name: Sync upstream

on:
  schedule:
    - cron: '0 13 * * 1' # weekly, Monday 13:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/xai-org/grok-build-plugin-cc.git
          git fetch upstream main

      - name: Check for new upstream commits
        id: check
        run: |
          if git merge-base --is-ancestor upstream/main main; then
            echo "has_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Try clean merge
        if: steps.check.outputs.has_new == 'true'
        id: merge
        run: |
          git checkout main
          if git merge upstream/main --no-edit -m "Sync upstream/main"; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "clean=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push clean sync directly to main
        if: steps.check.outputs.has_new == 'true' && steps.merge.outputs.clean == 'true'
        run: git push origin main

      - name: Publish conflict branch for manual resolution
        if: steps.check.outputs.has_new == 'true' && steps.merge.outputs.clean == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git checkout -B upstream-sync upstream/main
          git push origin upstream-sync --force
          gh pr create \
            --title "Upstream sync has conflicts with local fixes" \
            --body "Automated sync found new upstream commits that conflict with changes on main. Resolve manually: \`git checkout main && git merge upstream-sync\`, fix conflicts, commit, push." \
            --base main --head upstream-sync 2>/dev/null || echo "PR already exists for upstream-sync"
